<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0284c7">
  <link rel="manifest" href="./manifest.json">
  <title>Isekai Chronicles: Online 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1e1b4b 0%, #090919 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #viewport {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Auto-Landscape Orientation Prompt for Mobile */
    #portrait-rotate-prompt {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090919 100%);
      z-index: 999999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #portrait-rotate-prompt {
        display: flex !important;
      }
    }
    .rotate-phone-anim {
      font-size: 56px;
      animation: rotatePhone 2.2s infinite ease-in-out;
      margin-bottom: 20px;
    }
    @keyframes rotatePhone {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    .rotate-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .rotate-sub {
      font-size: 13px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.5;
    }
  </style>

  <!-- Stable Three.js & Core Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Modular Game Systems (Version 39 - Anti-Dizziness Steadicam Camera & Smooth Motion Tuning) -->
  <script src="./src/world/Stage.js?v=39"></script>
  <script src="./src/world/Town.js?v=39"></script>
  <script src="./src/world/Plains.js?v=39"></script>
  <script src="./src/world/Dungeon.js?v=39"></script>
  <script src="./src/world/EnvironmentSystem.js?v=39"></script>
  <script src="./src/world/WaystoneSystem.js?v=39"></script>
  <script src="./src/characters/CharacterLoader.js?v=39"></script>
  <script src="./src/characters/PlayerController.js?v=39"></script>
  <script src="./src/characters/MountSystem.js?v=39"></script>
  <script src="./src/combat/SoundEffects.js?v=39"></script>
  <script src="./src/combat/DamageText.js?v=39"></script>
  <script src="./src/combat/SkillSystem.js?v=39"></script>
  <script src="./src/combat/InventorySystem.js?v=39"></script>
  <script src="./src/combat/Monster.js?v=39"></script>
  <script src="./src/combat/CombatSystem.js?v=39"></script>
  <script src="./src/combat/QuestSystem.js?v=39"></script>
  <script src="./src/ui/CharacterSelectUI.js?v=39"></script>
  <script src="./src/ui/SaveSettingsSystem.js?v=39"></script>
  <script src="./src/ui/HUD.js?v=39"></script>
  <script src="./src/ui/MobileControls.js?v=39"></script>
  <script src="./src/multiplayer/MultiplayerSystem.js?v=39"></script>
</head>
<body>
  <!-- Auto-Landscape Warning on Mobile -->
  <div id="portrait-rotate-prompt">
    <div class="rotate-phone-anim">📱</div>
    <div class="rotate-title">PLEASE ROTATE TO LANDSCAPE</div>
    <div class="rotate-sub">Isekai Chronicles is built for widescreen landscape gaming. Turn your phone sideways to play!</div>
  </div>

  <canvas id="viewport"></canvas>

  <script>
    // Request landscape lock on first user touch
    const reqOrientationLock = () => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    };
    window.addEventListener('touchstart', reqOrientationLock, { once: true });
    window.addEventListener('click', reqOrientationLock, { once: true });
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('viewport');
      let gameState = 'SELECT'; // 'SELECT' or 'PLAYING'

      // 1. Initialize Stage & Character Loader
      const stage = new Stage(canvas);
      const characterLoader = new CharacterLoader(stage.scene);
      characterLoader.loadRace('human', 'male');

      // 2. Initialize Selection UI
      const selectUI = new CharacterSelectUI(characterLoader, stage);

      let town = null;
      let plains = null;
      let dungeon = null;
      let damageSystem = null;
      let combatSystem = null;
      let skillSystem = null;
      let inventorySystem = null;
      let mountSystem = null;
      let waystoneSystem = null;
      let environmentSystem = null;
      let questSystem = null;
      let playerController = null;
      let saveSystem = null;
      let hud = null;
      let multiplayerSystem = null;
      let mobileControls = null;

      // 3. Transition from Selection to Game World
      selectUI.onStartAdventure = (chosenClass, avatarIcon, heroName) => {
        if (gameState !== 'SELECT') return; // Prevent double initialization
        gameState = 'PLAYING';

        // Remove the pedestal showcase
        if (stage.pedestal) {
          stage.scene.remove(stage.pedestal);
        }

        // Disable orbit controls, enable 3rd person camera
        stage.controls.enabled = false;

        // Build 3D Starter Town & Guild Plaza (with Walk-in Guild Interior, Live NPCs & Shops)
        town = new StarterTown(stage.scene);

        // Build 3D Whispering Plains Outdoor Field (Phase 2)
        plains = new WhisperingPlains(stage.scene);

        // Build 3D Mystic Crystal Caverns Dungeon Map (Phase 4)
        dungeon = new MysticCaverns(stage.scene);

        // Setup Floating Damage Numbers & Hit Sparks
        damageSystem = new DamageSystem(stage.scene, stage.camera);

        // Setup 3rd Person WASD Player Controller with Raycast Ground Detection
        playerController = new PlayerController(characterLoader, stage.camera, canvas);
        playerController.position.set(0, 0.05, 7.5); // Spawn in front of fountain facing Guild
        const allGroundMeshes = [
          ...town.getGroundMeshes(),
          ...plains.getGroundMeshes(),
          ...dungeon.getGroundMeshes()
        ];
        playerController.setGroundMeshes(allGroundMeshes);

        // Setup Action RPG Combat Engine
        combatSystem = new CombatSystem(stage.scene, stage.camera, playerController, damageSystem);
        combatSystem.setRace(chosenClass);

        // Setup Active Combat Skills Engine (Phase 4)
        skillSystem = new SkillSystem(stage.scene, stage.camera, playerController, combatSystem, damageSystem);
        skillSystem.setRace(chosenClass);
        playerController.setSkillSystem(skillSystem);
        combatSystem.setSkillSystem(skillSystem);

        // Setup RPG Grid Inventory & 3D Visual Equipment Engine (Phase 5)
        inventorySystem = new InventorySystem(playerController, combatSystem);

        // Setup Heroic Mount System (Phase 6)
        mountSystem = new MountSystem(stage.scene, playerController);

        // Setup Ancient Waystone Fast-Travel Teleporters (Phase 6)
        waystoneSystem = new WaystoneSystem(stage.scene, playerController);

        // Setup 24-Hour Day/Night Cycle & Dynamic Weather (Phase 7)
        environmentSystem = new EnvironmentSystem(stage.scene, stage.sunLight, stage.hemiLight);
        environmentSystem.setTownLamps(town.getLamps());

        // Setup Guild Quest System (Phase 3 & 8)
        questSystem = new QuestSystem(combatSystem);
        combatSystem.setQuestSystem(questSystem);

        // Setup In-Game RPG HUD (Connected to combat stats, quests, skills, gear & zones)
        hud = new GameHUD(playerController, town, combatSystem, questSystem, skillSystem, inventorySystem, mountSystem, waystoneSystem, environmentSystem);
        hud.setPlayerInfo(chosenClass, avatarIcon);
        const nameEl = document.getElementById('plate-name');
        if (nameEl) nameEl.innerText = heroName || 'Hero';

        // Setup Real-Time Online Multiplayer Engine & In-Game Chat
        try {
          multiplayerSystem = new MultiplayerSystem(stage.scene, playerController, characterLoader, mountSystem, combatSystem);
          multiplayerSystem.connect(heroName, chosenClass);
          window.multiplayerSystem = multiplayerSystem;
        } catch (err) {
          console.error("Multiplayer initialization error:", err);
        }

        // Setup Mobile Touchscreen Controls (Virtual Joystick & Action Buttons)
        try {
          mobileControls = new MobileControls(playerController, skillSystem, combatSystem, mountSystem, inventorySystem);
          window.mobileControls = mobileControls;
        } catch (err) {
          console.error("MobileControls initialization error:", err);
        }

        // Setup Auto-Save & Settings System (Phase 9)
        try {
          saveSystem = new SaveSettingsSystem(combatSystem, inventorySystem, questSystem, environmentSystem);
          window.saveSystem = saveSystem;
          saveSystem.loadGame(); // Restore saved progress if available!
        } catch (err) {
          console.error("SaveSystem initialization error:", err);
        }

        // Start BGM
        if (window.soundFX) {
          window.soundFX.playBGM('town');
        }
      };

      // 4. Main Animation Loop
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05);

        if (gameState === 'SELECT') {
          characterLoader.update(delta);
          stage.update(delta);
        } else if (gameState === 'PLAYING') {
          if (playerController) playerController.update(delta);
          if (characterLoader) characterLoader.update(delta);
          if (mountSystem) mountSystem.update(delta);
          if (waystoneSystem) waystoneSystem.update(delta);
          if (environmentSystem) environmentSystem.update(delta, playerController ? playerController.position : null);
          if (town) town.update(delta);
          if (plains) plains.update(delta);
          if (dungeon) dungeon.update(delta);
          if (combatSystem) combatSystem.update(delta);
          if (damageSystem) damageSystem.update(delta);
          if (saveSystem) saveSystem.update(delta);
          if (multiplayerSystem) multiplayerSystem.update(delta);
          if (hud) hud.update();
          stage.update(delta, playerController ? playerController.position : null);
        }
      }
      animate();
    });
  </script>
</body>
</html>
